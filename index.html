<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07142f">
<meta name="description" content="Uma pequena surpresa feita com carinho.">
<title>Uma pequena surpresa</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Parisienne&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --night: #020611;
    --blue: #0b1740;
    --blue-soft: #243f82;
    --paper: #fbfcff;
    --ink: #17264f;
    --muted: #7180a1;
    --white: #ffffff;
    --gold: #f4e2a8;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    background:
        radial-gradient(circle at 52% 46%, rgba(64, 96, 175, .46) 0%, rgba(22, 40, 92, .38) 22%, transparent 50%),
        radial-gradient(circle at 14% 78%, rgba(46, 80, 155, .22), transparent 30%),
        radial-gradient(circle at 86% 20%, rgba(90, 120, 195, .16), transparent 26%),
        radial-gradient(circle at 30% 12%, rgba(120, 150, 220, .10), transparent 22%),
        linear-gradient(180deg, #010209 0%, #030817 24%, #071535 55%, #0a1c42 78%, #020611 100%);
    color: var(--white);
    font-family: Inter, Arial, sans-serif;
}

/* =========================
   CÉU
========================= */

.sky {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
}

.sky::before,
.sky::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(50px);
    opacity: .22;
}

.sky::after {
    width: 560px;
    height: 130px;
    right: 6%;
    top: 42%;
    border-radius: 50%;
    background: linear-gradient(90deg, transparent, rgba(110, 138, 215, .14), transparent);
    filter: blur(30px);
    transform: rotate(-18deg);
    opacity: .8;
}

.sky::before {
    width: 300px;
    height: 300px;
    left: -110px;
    bottom: -110px;
    background: #5f84d8;
}

/* Via Láctea sutil */
.milkyway {
    position: absolute;
    inset: -10% -20%;
    background: linear-gradient(115deg,
        transparent 30%,
        rgba(180, 200, 240, .05) 42%,
        rgba(210, 220, 250, .09) 48%,
        rgba(180, 200, 240, .05) 54%,
        transparent 66%);
    transform: rotate(-8deg);
    pointer-events: none;
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 8px rgba(255,255,255,.9);
    animation: brilho 3.5s infinite ease-in-out;
}

.star.small { width: 1px; height: 1px; box-shadow: 0 0 4px rgba(255,255,255,.7); }
.star.large { width: 3px; height: 3px; }

.star:nth-child(3)  { top: 8%;  left: 12%; animation-delay: .2s; }
.star:nth-child(4)  { top: 17%; left: 30%; animation-delay: .8s; }
.star:nth-child(5)  { top: 11%; left: 73%; animation-delay: 1.2s; }
.star:nth-child(6)  { top: 28%; left: 88%; animation-delay: .4s; }
.star:nth-child(7)  { top: 37%; left: 15%; animation-delay: 1.8s; }
.star:nth-child(8)  { top: 23%; left: 57%; animation-delay: 2s; }
.star:nth-child(9)  { top: 44%; left: 78%; animation-delay: .7s; }
.star:nth-child(10)  { top: 7%;  left: 91%; animation-delay: 1.5s; }
.star:nth-child(11) { top: 34%; left: 44%; animation-delay: 2.2s; }
.star:nth-child(12) { top: 54%; left: 9%;  animation-delay: 1s; }
.star:nth-child(13) { top: 18%; left: 83%; animation-delay: .5s; }
.star:nth-child(14) { top: 47%; left: 63%; animation-delay: 2.5s; }
.star:nth-child(15) { top: 62%; left: 27%; animation-delay: 1.3s; }
.star:nth-child(16) { top: 69%; left: 82%; animation-delay: .9s; }
.star:nth-child(17) { top: 80%; left: 52%; animation-delay: 1.7s; }
.star:nth-child(18) { top: 31%; left: 6%;  animation-delay: 2.1s; }
.star:nth-child(19) { top: 73%; left: 12%; animation-delay: .6s; }
.star:nth-child(20) { top: 13%; left: 48%; animation-delay: 1.9s; }
.star:nth-child(21) { top: 57%; left: 92%; animation-delay: 2.7s; }
.star:nth-child(22) { top: 4%;  left: 39%; animation-delay: 1.1s; }
.star:nth-child(23) { top: 25%; left: 4%;  animation-delay: 2.9s; }
.star:nth-child(24) { top: 66%; left: 60%; animation-delay: .3s; }
.star:nth-child(25) { top: 88%; left: 30%; animation-delay: 1.6s; }
.star:nth-child(26) { top: 50%; left: 35%; animation-delay: 2.3s; }
.star:nth-child(27) { top: 41%; left: 96%; animation-delay: .1s; }
.star:nth-child(28) { top: 77%; left: 68%; animation-delay: 1.4s; }
.star:nth-child(29) { top: 15%; left: 64%; animation-delay: 2.6s; }
.star:nth-child(30) { top: 91%; left: 84%; animation-delay: .85s; }

.star-bright {
    width: 4px;
    height: 4px;
    box-shadow:
        0 0 5px white,
        0 0 14px rgba(255,255,255,.8),
        0 0 25px rgba(180,205,255,.4);
}

.star-bright:nth-last-child(4) { top: 19%; left: 20%; animation-delay: 1.1s; }
.star-bright:nth-last-child(3) { top: 39%; left: 69%; animation-delay: 2.4s; }
.star-bright:nth-last-child(2) { top: 64%; left: 42%; animation-delay: .3s; }
.star-bright:nth-last-child(1) { top: 83%; left: 74%; animation-delay: 1.8s; }

@keyframes brilho {
    0%, 100% {
        opacity: .2;
        transform: scale(.7);
    }
    50% {
        opacity: 1;
        transform: scale(1.7);
    }
}

/* Estrela cadente — um único momento orquestrado */
.shooting-star {
    position: absolute;
    top: 16%;
    left: 8%;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: 0;
    filter: drop-shadow(0 0 6px rgba(255,255,255,.9));
    animation: cadente 9s ease-in 2.4s infinite;
}

.shooting-star::before {
    content: "";
    position: absolute;
    top: 50%;
    right: 0;
    width: 130px;
    height: 1px;
    background: linear-gradient(90deg, rgba(255,255,255,.9), transparent);
    transform: translateY(-50%);
}

@keyframes cadente {
    0%, 60%, 100% { opacity: 0; transform: translate(0, 0); }
    61% { opacity: 1; }
    72% { opacity: 0; transform: translate(340px, 190px); }
}

/* =========================
   LUA
========================= */

.moon {
    position: absolute;
    width: 92px;
    height: 92px;
    top: 9%;
    right: 11%;
    border-radius: 50%;
    background: #fff8d7;
    box-shadow:
        0 0 24px rgba(255,244,181,.8),
        0 0 65px rgba(255,240,170,.22);
}

.moon::after {
    content: "";
    position: absolute;
    width: 92px;
    height: 92px;
    border-radius: 50%;
    background: #071333;
    left: -25px;
    top: -9px;
}

.moon-glow {
    position: absolute;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    right: calc(11% - 34px);
    top: calc(9% - 34px);
    border: 1px solid rgba(255,255,255,.04);
}

/* =========================
   CENA
========================= */

.scene {
    position: relative;
    z-index: 5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
}

/* =========================
   CARTA
========================= */

.letter {
    width: min(720px, 91vw);
    min-height: 430px;
    padding: 72px 72px;
    position: relative;
    color: var(--ink);
    background:
        radial-gradient(circle at 15% 10%, rgba(182,205,245,.17), transparent 30%),
        radial-gradient(circle at 85% 90%, rgba(207,220,248,.22), transparent 31%),
        linear-gradient(135deg, rgba(255,255,255,.995), rgba(245,248,255,.985));
    border: 1px solid rgba(255,255,255,.95);
    border-radius: 14px;
    box-shadow:
        0 34px 100px rgba(0,0,0,.58),
        0 0 55px rgba(145,180,255,.16),
        0 1px 0 rgba(255,255,255,.95) inset,
        inset 0 0 60px rgba(80,110,170,.045);
    transform: rotate(-.45deg);
    animation: cartaEntrada 1.25s cubic-bezier(.2,.8,.2,1) both;
}

.letter::before {
    content: "";
    position: absolute;
    inset: 14px;
    border: 1px solid rgba(40,70,130,.13);
    border-radius: 8px;
    pointer-events: none;
}

.letter::after {
    content: "✦";
    position: absolute;
    top: 25px;
    left: 31px;
    font-family: Georgia, serif;
    font-size: 13px;
    color: #8ca7d9;
    opacity: .85;
    text-shadow: 0 0 10px rgba(100,130,190,.25);
}

@keyframes cartaEntrada {
    from {
        opacity: 0;
        transform: translateY(25px) rotate(-2deg) scale(.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) rotate(-.7deg) scale(1);
    }
}

.content {
    position: relative;
    z-index: 2;
    text-align: center;
}

.intro {
    margin-bottom: 42px;
    color: #7183aa;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 5px;
    text-transform: uppercase;
}

.intro::after {
    content: "";
    display: block;
    width: 42px;
    height: 1px;
    margin: 14px auto 0;
    background: #b5c5e1;
}

/* =========================
   BOTÃO
========================= */

.open-button {
    border: 1px solid rgba(65,91,145,.14);
    cursor: pointer;
    padding: 16px 37px;
    border-radius: 50px;
    color: #29457d;
    background:
        linear-gradient(135deg, rgba(255,255,255,.98), rgba(227,237,255,.98));
    font-family: Inter, Arial, sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .8px;
    text-transform: lowercase;
    box-shadow:
        0 10px 30px rgba(30,60,120,.18),
        0 0 0 1px rgba(104,134,190,.08),
        inset 0 1px 0 rgba(255,255,255,.98);
    transition: transform .3s ease, box-shadow .3s ease, background .3s ease;
}

.open-button:hover {
    transform: translateY(-4px);
    box-shadow:
        0 15px 35px rgba(30,60,120,.24),
        0 0 20px rgba(130,165,230,.18);
    background: linear-gradient(135deg, #ffffff, #eaf1ff);
}

.open-button:active {
    transform: scale(.96);
}

/* =========================
   MENSAGEM
========================= */

.message {
    display: none;
    max-width: 610px;
    margin: 0 auto;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: clamp(31px, 4.7vw, 46px);
    font-weight: 500;
    line-height: 1.22;
    letter-spacing: -.6px;
    text-wrap: balance;
    overflow-wrap: break-word;
    text-shadow: 0 1px 0 rgba(255,255,255,.7);
}

.message.show {
    display: block;
    animation: mensagemEntrada 1.4s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes mensagemEntrada {
    0% {
        opacity: 0;
        transform: translateY(24px);
        filter: blur(5px);
    }
    55% {
        opacity: 1;
        filter: blur(0);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
    }
}

.message::first-letter {
    color: #4567a8;
}

.message-line {
    width: 46px;
    height: 1px;
    margin: 17px auto 0;
    background: linear-gradient(90deg, transparent, #a8badb, transparent);
    opacity: .7;
}

.signature {
    margin-top: 40px;
    font-family: "Parisienne", cursive;
    font-size: 26px;
    font-weight: 400;
    letter-spacing: .4px;
    color: #7185ac;
}

.soundtrack {
    margin-top: 14px;
    font-family: Inter, Arial, sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 2px;
    color: #9aa9c9;
}

.soundtrack .note {
    display: inline-block;
    margin: 0 6px;
    opacity: .8;
}

/* =========================
   PONTINHOS DECORATIVOS
========================= */

.corner {
    position: absolute;
    width: 8px;
    height: 8px;
    border: 1px solid #a9b9d8;
    opacity: .5;
}

.corner.one {
    top: 28px;
    right: 29px;
    border-left: 0;
    border-bottom: 0;
}

.corner.two {
    bottom: 28px;
    left: 29px;
    border-right: 0;
    border-top: 0;
}

/* =========================
   BUQUÊ DE ROSAS
========================= */

.bouquet {
    position: fixed;
    z-index: 8;
    right: 3%;
    bottom: 1%;
    width: 235px;
    height: 300px;
    pointer-events: none;
    animation: bouquetFloat 5s ease-in-out infinite;
    transform-origin: bottom center;
}

@keyframes bouquetFloat {
    0%, 100% {
        transform: translateY(0) rotate(2deg);
    }
    50% {
        transform: translateY(-8px) rotate(-2deg);
    }
}

.stem {
    position: absolute;
    width: 5px;
    height: 170px;
    left: 110px;
    bottom: 25px;
    border-radius: 10px;
    background: linear-gradient(90deg, #1d4739, #356c52);
}

.stem.s2 {
    height: 150px;
    left: 80px;
    transform: rotate(-18deg);
}

.stem.s3 {
    height: 145px;
    left: 140px;
    transform: rotate(14deg);
}

.leaf {
    position: absolute;
    width: 80px;
    height: 30px;
    border-radius: 100% 0 100% 0;
    background: linear-gradient(135deg, #183f35, #39725a);
    filter: drop-shadow(0 5px 4px rgba(0,0,0,.3));
}

.leaf.l1 {
    left: 55px;
    bottom: 70px;
}

.leaf.l2 {
    left: 100px;
    bottom: 90px;
    transform: rotate(30deg) scale(.8);
}

.leaf.l3 {
    left: 25px;
    bottom: 110px;
    transform: rotate(-55deg) scale(.75);
}

.white-rose {
    position: absolute;
    width: 82px;
    height: 82px;
    border-radius: 50%;
    background:
        radial-gradient(circle at 50% 50%,
        #ffffff 0 17%,
        #edf2f8 18% 29%,
        #ffffff 30% 42%,
        #dce5ee 43% 56%,
        #ffffff 57% 71%,
        #d6e0eb 72% 100%);
    box-shadow:
        0 4px 15px rgba(0,0,0,.25),
        0 0 20px rgba(255,255,255,.25);
    animation: roseBreath 4s ease-in-out infinite;
}

.white-rose::before,
.white-rose::after {
    content: "";
    position: absolute;
    inset: 5px;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 7px solid rgba(255,255,255,.72);
}

.white-rose::after {
    transform: rotate(45deg);
}

@keyframes roseBreath {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.045); }
}

.r1 {
    left: 68px;
    top: 30px;
}

.r2 {
    left: 15px;
    top: 72px;
    transform: scale(.85);
    animation-delay: .5s;
}

.r3 {
    left: 125px;
    top: 72px;
    transform: scale(.85);
    animation-delay: 1s;
}

.r4 {
    left: 55px;
    top: 105px;
    transform: scale(.72);
    animation-delay: 1.5s;
}

.r5 {
    left: 105px;
    top: 112px;
    transform: scale(.72);
    animation-delay: 2s;
}

.ribbon {
    position: absolute;
    left: 83px;
    bottom: 18px;
    width: 75px;
    height: 50px;
    background: linear-gradient(135deg, #819dd1, #a9bee2);
    clip-path: polygon(0 0, 100% 0, 82% 100%, 50% 70%, 18% 100%);
    filter: drop-shadow(0 4px 4px rgba(0,0,0,.25));
}

.ribbon::before,
.ribbon::after {
    content: "";
    position: absolute;
    top: -18px;
    width: 42px;
    height: 35px;
    border-radius: 50% 50% 0 50%;
    background: #a9bee2;
}

.ribbon::before {
    left: -24px;
    transform: rotate(-25deg);
}

.ribbon::after {
    right: -24px;
    transform: scaleX(-1) rotate(-25deg);
}

/* =========================
   RODAPÉ
========================= */

.hint {
    position: fixed;
    z-index: 10;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    color: rgba(255,255,255,.43);
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    white-space: nowrap;
    text-align: center;
}

.hint span {
    display: block;
    margin-top: 4px;
    font-size: 8px;
    letter-spacing: 3px;
    color: rgba(255,255,255,.28);
}

/* =========================
   TELAS GRANDES (desktop / monitor)
========================= */

@media (min-width: 1440px) {
    .letter {
        width: min(780px, 55vw);
        padding: 84px 84px;
    }

    .message {
        font-size: clamp(34px, 3vw, 50px);
    }

    .bouquet {
        right: 5%;
        width: 260px;
        height: 330px;
    }

    .moon {
        width: 104px;
        height: 104px;
    }

    .moon::after {
        width: 104px;
        height: 104px;
    }
}

@media (min-width: 1920px) {
    .letter {
        width: min(860px, 46vw);
    }

    .bouquet {
        right: 8%;
        width: 285px;
        height: 360px;
    }
}

/* =========================
   ALTURAS BAIXAS (notebook pequeno, celular deitado)
========================= */

@media (max-height: 720px) and (min-width: 701px) {
    .scene {
        padding: 20px;
    }

    .letter {
        min-height: auto;
        padding: 48px 60px;
    }

    .intro {
        margin-bottom: 26px;
    }

    .message {
        font-size: clamp(24px, 3.6vw, 34px);
    }

    .signature {
        margin-top: 24px;
    }

    .bouquet {
        transform: scale(.65);
        transform-origin: bottom right;
    }
}

@media (max-height: 480px) {
    .scene {
        padding: 14px;
        align-items: flex-start;
        padding-top: 28px;
    }

    .letter {
        min-height: auto;
        padding: 30px 5vw;
    }

    .intro {
        margin-bottom: 16px;
    }

    .message {
        font-size: clamp(18px, 4vw, 26px);
        line-height: 1.2;
    }

    .signature {
        margin-top: 16px;
    }

    .moon {
        display: none;
    }

    .bouquet {
        transform: scale(.4);
        right: -20px;
        bottom: -30px;
    }

    .hint {
        display: none;
    }
}

/* =========================
   RESPONSIVO (mobile)
========================= */

@media (max-width: 700px) {
    body {
        overflow: hidden;
    }

    .scene {
        padding: 18px;
    }

    .letter {
        width: min(92vw, 560px);
        min-height: 350px;
        padding: 54px 27px;
        transform: rotate(-.35deg);
    }

    .intro {
        margin-bottom: 32px;
        font-size: 9px;
        letter-spacing: 3px;
    }

    .message {
        font-size: clamp(27px, 7.2vw, 35px);
        line-height: 1.25;
        max-width: 480px;
    }

    .signature {
        margin-top: 30px;
        font-size: 22px;
        letter-spacing: .3px;
    }

    .soundtrack {
        font-size: 9px;
        letter-spacing: 1.5px;
    }

    .open-button {
        padding: 14px 28px;
        font-size: 13px;
    }

    .bouquet {
        right: -35px;
        bottom: -25px;
        transform: scale(.58);
        transform-origin: bottom right;
        opacity: .92;
    }

    .moon {
        width: 62px;
        height: 62px;
        top: 7%;
        right: 8%;
    }

    .moon::after {
        width: 62px;
        height: 62px;
        left: -17px;
        top: -6px;
    }

    .moon-glow {
        display: none;
    }

    .hint {
        bottom: 10px;
        font-size: 7px;
        letter-spacing: 2.5px;
    }

    .letter::after {
        top: 20px;
        left: 24px;
    }
}

@media (max-width: 390px) {
    .letter {
        min-height: 330px;
        padding: 48px 23px;
    }

    .message {
        font-size: 23px;
        line-height: 1.27;
    }

    .signature {
        font-size: 18px;
    }

    .bouquet {
        transform: scale(.48);
        right: -48px;
        bottom: -38px;
    }
}

@media (max-width: 360px) {
    .scene {
        padding: 12px;
    }

    .letter {
        width: 94vw;
        min-height: 315px;
        padding: 43px 18px;
        border-radius: 9px;
    }

    .letter::before {
        inset: 10px;
    }

    .letter::after {
        top: 17px;
        left: 19px;
        font-size: 11px;
    }

    .intro {
        margin-bottom: 26px;
        font-size: 8px;
        letter-spacing: 2.5px;
    }

    .intro::after {
        margin-top: 11px;
        width: 32px;
    }

    .open-button {
        padding: 13px 24px;
        font-size: 12px;
    }

    .message {
        font-size: 22px;
        line-height: 1.28;
        letter-spacing: -.2px;
    }

    .signature {
        margin-top: 24px;
        font-size: 17px;
        letter-spacing: .2px;
    }

    .soundtrack {
        font-size: 8px;
    }

    .moon {
        width: 48px;
        height: 48px;
        top: 6%;
        right: 7%;
    }

    .moon::after {
        width: 48px;
        height: 48px;
        left: -13px;
        top: -5px;
    }

    .bouquet {
        right: -63px;
